[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "riskmetrics"
version = "0.1.0"
description = "Generic, dependency-light toolkit for portfolio risk and performance reporting"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pandas>=1.3",
    "numpy>=1.21",
    "scipy>=1.7",
    "matplotlib>=3.4",
    "python-dateutil>=2.8",
]

[tool.setuptools.packages.find]
include = ["riskmetrics*"]
